name: termux-node-addon

on:
  workflow_dispatch:
    inputs:
      num_threads:
        description: "Parallel build jobs"
        required: false
        default: "4"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix ownership for in-container user (builder, uid 1000)
        run: sudo chown -R 1000:1000 "$PWD"

      - name: Build lbugjs.node inside official Termux container
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            termux/termux-docker:latest \
            /data/data/com.termux/files/usr/bin/bash -c '
              set -e
              export PATH=/data/data/com.termux/files/usr/bin:$PATH
              echo "=== [1/6] apt update — $(date -u +%H:%M:%S) ==="
              apt update -o Acquire::Retries=5 || apt update -o Acquire::Retries=5
              echo "=== [2/6] apt install toolchain ==="
              apt install -y -o Acquire::Retries=5 clang cmake ninja make python nodejs openssl file \
                || apt install -y --fix-missing clang cmake ninja make python nodejs openssl file
              echo "=== [3/6] versões: $(node --version) | cmake $(cmake --version | head -1 | cut -d" " -f3) | $(clang --version | head -1)"
              cd tools/nodejs_api
              echo "=== [4/6] npm install (node-addon-api/cmake-js) — $(date -u +%H:%M:%S) ==="
              npm install --no-audit --no-fund
              cd ../..
              echo "=== [5/6] make nodejs (ninja) — $(date -u +%H:%M:%S) ==="
              make nodejs NUM_THREADS=${{ inputs.num_threads }} GEN=Ninja
              echo "=== [6/6] artifact pronto — $(date -u +%H:%M:%S) ==="
              ls -la tools/nodejs_api/build/lbugjs.node
              file tools/nodejs_api/build/lbugjs.node
              sha256sum tools/nodejs_api/build/lbugjs.node
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lbugjs-termux-aarch64
          path: tools/nodejs_api/build/lbugjs.node
          if-no-files-found: error
